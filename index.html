<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конспект на плоттере: презентация</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{--paper:#F4F7FB;--grid:#DCE5F0;--card:#FFFFFF;--ink:#0E1B30;--mute:#46566E;--line:#9FB2C9;--cloud:#4B3A8C;--fog:#1553B5;--dev:#06706F;--err:#B81D2F;--ok:#1F7A33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--paper:#0B121C;--grid:#16212F;--card:#152030;--ink:#F2F6FB;--mute:#B3C2D6;--line:#3A4D66;--cloud:#B5A8F0;--fog:#8CBBFA;--dev:#5EE0D3;--err:#FF8A96;--ok:#8EE09D;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
*,*:before,*:after{box-sizing:inherit}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:5vmin 5vmin;color:var(--ink);font:400 clamp(18px,2.6vmin,34px)/1.4 "Golos Text",system-ui,sans-serif}
.sl{position:absolute;inset:0 0 9vmin 0;padding:5vmin 7vw 2vmin;display:none;flex-direction:column;justify-content:center;gap:3vmin}
.sl.on{display:flex}
h1{font:700 clamp(56px,15vmin,200px)/0.92 Caveat,"Segoe Script",cursive;margin:0}
h2{font:700 clamp(48px,11vmin,150px)/0.95 Caveat,"Segoe Script",cursive;margin:0}
.sub{color:var(--mute);font-size:clamp(20px,3.4vmin,44px);max-width:34ch;margin:0}
.tag{display:inline-block;align-self:flex-start;border:.4vmin solid var(--c);color:var(--c);border-radius:99px;padding:.4vmin 2vmin;font-weight:600;font-size:clamp(16px,2.4vmin,30px)}
.cloud{--c:var(--cloud)}.fog{--c:var(--fog)}.dev{--c:var(--dev)}
.io{display:grid;grid-template-columns:1fr auto 1fr;gap:2.5vmin;align-items:stretch}
.box{background:var(--card);border:.5vmin solid var(--c,var(--line));border-radius:2vmin;padding:2.5vmin 3vmin}
.box small{display:block;color:var(--mute);font-size:.7em;margin-bottom:.5vmin}
.box b{font-weight:600;font-size:1.25em}
.ar{align-self:center;font:700 clamp(40px,9vmin,120px) Caveat,cursive;color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2.5vmin}
.pair .box{border-width:.7vmin}
.bad{border-color:var(--err)}.bad small{color:var(--err);font-weight:600}
.good{border-color:var(--ok)}.good small{color:var(--ok);font-weight:600}
.map{display:flex;flex-wrap:wrap;gap:2vmin 1.5vmin;align-items:center}
.map .box{padding:2vmin 2.4vmin;font-weight:600}
.map .ar{font-size:clamp(28px,6vmin,80px)}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:3vmin}
.lane{border:.6vmin dashed var(--c);border-radius:2vmin;padding:3vmin;background:var(--card)}
.lane b{display:block;font-size:1.3em;font-weight:600;color:var(--c)}
.join{text-align:center;font:700 clamp(30px,6vmin,80px) Caveat,cursive;color:var(--mute)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5vmin}
.res .box b{display:block;margin-bottom:1vmin}
.res .box span{color:var(--mute);font-size:.85em}
.nav{position:absolute;left:0;right:0;bottom:0;height:9vmin;min-height:56px;display:flex;align-items:center;gap:2vw;padding:0 7vw env(safe-area-inset-bottom,0px);border-top:.4vmin solid var(--ink);background:var(--paper)}
.track{flex:1;display:flex;gap:.6vmin;height:1.2vmin}
.track i{flex:1;background:var(--line);border-radius:1vmin}
.track i.d{background:var(--ink)}
button{font:600 clamp(16px,2.6vmin,32px) "Golos Text",system-ui,sans-serif;color:var(--ink);background:var(--card);border:.4vmin solid var(--ink);border-radius:1.4vmin;min-width:44px;min-height:44px;padding:.6vmin 2vmin;cursor:pointer}
button:focus-visible{outline:.6vmin solid var(--fog);outline-offset:.4vmin}
.cnt{min-width:5ch;text-align:center;font-weight:600}
.ctl2{display:flex;gap:2vmin;flex-wrap:wrap;align-items:center}
select{font:600 clamp(16px,2.6vmin,32px) "Golos Text",system-ui,sans-serif;color:var(--ink);background:var(--card);border:.4vmin solid var(--ink);border-radius:1.4vmin;min-height:44px;padding:.6vmin 1.6vmin;max-width:100%}
select:focus-visible{outline:.6vmin solid var(--fog);outline-offset:.4vmin}
button.go{background:var(--fog);border-color:var(--fog);color:var(--paper)}
.sim{display:flex;flex-wrap:wrap;gap:1.4vmin}
.chip{background:var(--card);border:.5vmin solid var(--line);border-radius:1.6vmin;padding:1.2vmin 2vmin;font-weight:600;font-size:.85em}
.chip.on{border-color:var(--fog);background:var(--fog);color:var(--paper)}
.chip.done{border-color:var(--ok)}
.chip.bad{border-color:var(--err);background:var(--err);color:var(--paper)}
.stat{background:var(--card);border:.5vmin solid var(--ink);border-radius:2vmin;padding:2.5vmin 3vmin;min-height:14vmin}
.stat b{display:block;font-size:1.2em;font-weight:600;margin-bottom:.8vmin}
.stat.err{border-color:var(--err)}
#fx{display:none;margin-top:1.5vmin}
.stat.err #fx{display:inline-block}
@media (max-width:700px){.io,.pair,.lanes,.res{grid-template-columns:1fr}.ar{transform:rotate(90deg);justify-self:center}}
@media (prefers-reduced-motion:no-preference){.sl.on{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateX(2vw)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><button id="pv" aria-label="Назад">←</button><div class="track" id="tr"></div><span class="cnt" id="ct"></span><button id="th" aria-label="Сменить тему">Тема</button><button id="nx" aria-label="Вперёд">→</button></div>
<script>
var S=[
{n:"Telegram-бот",l:"cloud",t:"облако",i:"файл .txt или сообщение",o:"сырой текст",e:"Пользователь не в списке доступа",f:"Отказ и список ALLOWED_USERS"},
{n:"Claude AI",l:"cloud",t:"облако",i:"сырой текст",o:"готовый конспект",e:"Ошибка API или слишком длинный текст",f:"Повтор ×3, длинный текст режем на части"},
{n:"Разбиение на страницы",l:"fog",t:"компьютер",i:"конспект",o:"N страниц со строками",e:"Часть текста не поместилась",f:"Сверять число строк до и после"},
{n:"SVG в папку Bachin Draw",l:"fog",t:"компьютер",i:"строки страницы",o:"файл .svg",e:"Папки нет или нет прав записи",f:"Создавать папку при старте, команда /status"},
{n:"Arduino: перелистывание",l:"dev",t:"устройство",i:"команда TURN по COM",o:"ответ DONE",e:"Arduino не ответила DONE",f:"Таймаут 5 с, один повтор, затем вручную"}
];
function stage(x,k){return '<section class="sl '+x.l+'"><span class="tag">'+x.t+'</span><h2>'+x.n+'</h2><div class="io"><div class="box"><small>Вход</small><b>'+x.i+'</b></div><div class="ar">→</div><div class="box"><small>Выход</small><b>'+x.o+'</b></div></div><div class="pair"><div class="box bad"><small>Что может сломаться</small><b>'+x.e+'</b></div><div class="box good"><small>Что делаем</small><b>'+x.f+'</b></div></div></section>'}
var h='<section class="sl"><h1>Конспект, который печатает плоттер</h1><p class="sub">IoT-система автоматизации: Telegram, ИИ, плоттер и Arduino</p><p class="sub">Зайцев И.П., Пшенников И.М., Тельманов И.Б., Быков А.Е., Ганишевский А.Э. · БИК-24-АП1 · ВВГУ</p></section>';
h+='<section class="sl"><h2>Как устроена система</h2><div class="map"><div class="box cloud">Telegram</div><div class="ar">→</div><div class="box cloud">Claude AI</div><div class="ar">→</div><div class="box fog">Страницы и SVG</div><div class="ar">→</div><div class="box dev">Плоттер</div><div class="ar">→</div><div class="box dev">Arduino</div></div><p class="sub">Фиолетовый — облако, синий — компьютер, бирюзовый — устройства. Дальше каждый этап отдельно: вход, выход, ошибка, решение.</p></section>';
S.slice(0,4).forEach(function(x,k){h+=stage(x,k)});
h+='<section class="sl dev"><span class="tag">устройства</span><h2>Печать идёт параллельно</h2><div class="lanes"><div class="lane"><b>Плоттер</b>рисует страницу по G-code через USB</div><div class="lane" style="--c:var(--cloud)"><b>Telegram</b>шлёт статус «страница i из N»</div></div><div class="join">затем ждём обе ветки → Arduino листает</div></section>';
h+=stage(S[4],4);
h+='<section class="sl"><h2>Цикл по страницам</h2><div class="map"><div class="box fog">SVG</div><div class="ar">→</div><div class="box dev">Печать</div><div class="ar">→</div><div class="box dev">TURN</div><div class="ar">→</div><div class="box">Ещё страницы?</div></div><p class="sub">Если да — возвращаемся к SVG. Если нет — бот присылает отчёт.</p></section>';
h+='<section class="sl"><h2>Главная проблема в коде</h2><div class="pair"><div class="box bad"><small>Сейчас</small><b>Пауза 2 секунды вместо ожидания конца печати</b>Страница листается во время печати</div><div class="box good"><small>Решение</small><b>Ждать подтверждения /next</b>Либо считать время по длине G-code</div></div></section>';
h+='<section class="sl"><h2>Ограничения ресурсов</h2><div class="res"><div class="box"><b>Один плоттер</b><span>Заказы по очереди, нужна очередь</span></div><div class="box"><b>Лимит Claude</b><span>4000 токенов, длинные тексты режем</span></div><div class="box"><b>ПК включён</b><span>USB и COM живут только на нём</span></div></div></section>';
var SM=[{n:"Telegram",e:"Пользователь не в списке доступа",f:"Отказ и список ALLOWED_USERS"},{n:"Claude AI",e:"Ошибка API или слишком длинный текст",f:"Повтор ×3, длинный текст режем на части"},{n:"Страницы",e:"Часть текста не поместилась",f:"Сверять число строк до и после"},{n:"SVG",e:"Папки Bachin Draw нет или нет прав",f:"Создавать папку при старте, команда /status"},{n:"Печать",e:"Пауза 2 секунды вместо конца печати",f:"Ждать подтверждения /next"},{n:"Arduino TURN",e:"Arduino не ответила DONE",f:"Таймаут 5 с, один повтор, затем вручную"}];
h+='<section class="sl"><h2>Живой прогон: сломайте этап</h2><div class="ctl2"><select id="brk" aria-label="Что сломать"><option value="-1">Ничего, идеальный прогон</option>'+SM.map(function(x,k){return '<option value="'+k+'">Сломать: '+x.n+'</option>'}).join('')+'</select><button class="go" id="rn">Запустить прогон</button></div><div class="sim">'+SM.map(function(x,k){return '<div class="chip" id="c'+k+'">'+x.n+'</div>'}).join('')+'</div><div class="stat" id="sbox" aria-live="polite"><b id="stt">Готово к запуску</b><div id="std">Выберите этап, который сломается, и запустите.</div><button class="go" id="fx">Применить решение</button></div></section>';
h+='<section class="sl"><h2>Полная схема с лентой этапов</h2><iframe src="iot-plotter-scheme.html" title="Интерактивная схема" style="flex:1;min-height:0;width:100%;border:.5vmin solid var(--ink);border-radius:2vmin;background:var(--paper)"></iframe><p class="sub" style="max-width:none"><a href="iot-plotter-scheme.html" target="_blank" rel="noopener" style="color:var(--fog)">Открыть на весь экран</a></p></section>';
h+='<section class="sl"><h1>Спасибо за внимание</h1><p class="sub">Вопросы?</p></section>';
document.getElementById("deck").innerHTML=h;
var sl=document.querySelectorAll(".sl"),tr=document.getElementById("tr"),ct=document.getElementById("ct"),c=0;
tr.innerHTML=Array.prototype.map.call(sl,function(){return "<i></i>"}).join("");
function go(n){c=Math.max(0,Math.min(sl.length-1,n));sl.forEach(function(s,k){s.classList.toggle("on",k===c)});tr.querySelectorAll("i").forEach(function(i,k){i.classList.toggle("d",k<=c)});ct.textContent=(c+1)+"/"+sl.length;try{history.replaceState(null,"","#"+(c+1))}catch(e){}}
document.getElementById("nx").onclick=function(){go(c+1)};
document.getElementById("pv").onclick=function(){go(c-1)};
document.getElementById("th").onclick=function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};
document.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT"||(e.target.tagName==="BUTTON"&&e.key===" "))return;if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(c+1)}else if(e.key==="ArrowLeft"||e.key==="PageUp"){go(c-1)}else if(e.key==="Home"){go(0)}else if(e.key==="End"){go(sl.length-1)}});
var x0=null;document.addEventListener("touchstart",function(e){x0=e.touches[0].clientX});
document.addEventListener("touchend",function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(c+(d<0?1:-1));x0=null});
var brk=document.getElementById("brk"),rn=document.getElementById("rn"),fx=document.getElementById("fx"),stt=document.getElementById("stt"),std=document.getElementById("std"),sbox=document.getElementById("sbox"),busy=false,fixer=null;
function nap(ms){return new Promise(function(r){setTimeout(r,ms)})}
fx.onclick=function(){if(fixer)fixer()};
rn.onclick=async function(){
 if(busy)return;busy=true;rn.disabled=true;var fixed=false;
 SM.forEach(function(x,k){document.getElementById("c"+k).className="chip"});
 for(var k=0;k<SM.length;k++){
  var ch=document.getElementById("c"+k);ch.classList.add("on");
  stt.textContent=SM[k].n;std.textContent="Работает…";
  await nap(900);
  if(+brk.value===k&&!fixed){
   ch.classList.remove("on");ch.classList.add("bad");sbox.classList.add("err");
   stt.textContent="Сбой: "+SM[k].e;std.textContent="Решение: "+SM[k].f;
   await new Promise(function(r){fixer=r});fixer=null;fixed=true;
   sbox.classList.remove("err");ch.classList.remove("bad");ch.classList.add("on");
   stt.textContent="Решение применено";await nap(900);
  }
  ch.classList.remove("on");ch.classList.add("done");
 }
 stt.textContent="Прогон завершён";std.textContent="Все этапы пройдены. Можно сломать другой этап и запустить снова.";
 busy=false;rn.disabled=false;rn.textContent="Запустить снова";
};
var st=parseInt(location.hash.slice(1),10);go(st>0?st-1:0);
</script>
</body>
</html>
